<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="t d">
  <title id="t">Edit conflict sequence</title>
  <desc id="d">Two editors load revision 4, both save, and the engine merges or asks.</desc>
  <rect width="480" height="200" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222">
    <text x="40" y="30">Editor A</text>
    <text x="400" y="30">Editor B</text>
    <text x="195" y="30">Page (r4)</text>
  </g>
  <g stroke="#222" stroke-width="1.5" fill="none">
    <line x1="60" y1="40" x2="60" y2="180"/>
    <line x1="420" y1="40" x2="420" y2="180"/>
    <line x1="240" y1="40" x2="240" y2="180" stroke-dasharray="4 4"/>
    <path d="M60 70 H235" marker-end="url(#a)"/>
    <path d="M420 100 H245" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#222"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="12" fill="#444">
    <text x="90" y="62">save (base r4)</text>
    <text x="260" y="92">save (base r4)</text>
    <text x="150" y="160">merge, or ask the second editor</text>
  </g>
</svg>
