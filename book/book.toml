# mdBook configuration for the Wiki Commons site.
# The source tree book/src/ is generated by `python3 tools/build_book.py`; see book/README.md.

[book]
title = "Wiki Commons"
description = "Open guidelines for wiki engines: a pattern language for the wiki experience and portable conventions so that knowledge outlives the software it was written in."
authors = ["Wiki Commons contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/wiki-commons/"
git-repository-url = "https://github.com/kos-commons/wiki-commons"
edit-url-template = "https://github.com/kos-commons/wiki-commons/edit/main/{path}"
no-section-label = true
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
